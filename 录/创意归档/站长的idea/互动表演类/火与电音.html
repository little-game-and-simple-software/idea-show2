    <p>利用火与电子音乐</p>
    <p>利用温度传感器的温度变化电压原理（模拟电路），根据不同的电压，产生不同频率赫兹的电音</p>
    <small>关于12平均律和蜡烛（0-500度)的映射关系</small>
    <p>500/5=100</p>
    <p>每100度，对应一个音阶</p>
    <p>以国际标准音A-la-440HZ为准：do的频率为261.6HZ，re的频率为293.6HZ，mi的频率为329.6HZ，fa的频率为349.2HZ，sol的频率为392HZ，la的频率为440HZ，si的频率为493.8HZ。</p>
